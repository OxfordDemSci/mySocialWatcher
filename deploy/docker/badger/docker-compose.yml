# docker-compose to deploy multiple collectors
version: '3.1'

services:

  dgg_national:
    container_name: dgg_national
    volumes:
      - ./data/dgg_national:/app/data
    build:
      args:
        collection_dir: "./deploy/docker/badger/dgg_national"
      context: ../../../
      dockerfile: ./deploy/docker/Dockerfile
    restart: unless-stopped
