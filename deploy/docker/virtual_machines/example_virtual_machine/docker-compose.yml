# example docker-compose to deploy one or more collections on a virtual machine
version: '3.3'

services:
  example_collection:
    container_name: example_collection
    volumes:
      - ./../../../data/example_collection:/app/data
    build:
      args:
        virtual_machine: example_virtual_machine
        collection_dir: "./deploy/docker/virtual_machines/example_virtual_machine/example_collection"
      context: ./../../../../
      dockerfile: ./deploy/docker/virtual_machines/Dockerfile
    restart: unless-stopped
