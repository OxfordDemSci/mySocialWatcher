services:

  ukraine_admin2_tessellation_homerecent:
    container_name: ukraine_admin2_tessellation_homerecent
    volumes:
      - ./ukraine_admin2_tessellation_homerecent:/app/in
      - ./../../../data/monty/ukraine_admin2_tessellation_homerecent:/app/data
    build:
      args:
        sleep_time: 0
        email_notification_enable: "True"
        email_receiver: "douglas.leasure@demography.ox.ac.uk,edith.darin@demography.ox.ac.uk"
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: on-failure
