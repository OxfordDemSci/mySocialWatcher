# docker-compose to deploy multiple collectors
version: '3.3'

services:

  venezuelan_exodus:
    container_name: venezuelan_exodus
    volumes:
      - ./../../../data/mingo/venezuelan_exodus:/app/data
    build:
      args:
        collection_dir: "./docker/collectors/mingo/venezuelan_exodus"
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: unless-stopped

