# docker-compose to deploy one or multiple collectors (i.e. services)
version: '3.3'

services:

  dgg_national:
    container_name: dgg_national
    volumes:
      - ./dgg_national:/app/in
      - ./../../../data/badger/dgg_national:/app/data
    build:
      args:
        sleep_time: 0
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: on-failure

  dgg_national_ins:
    container_name: dgg_national_ins
    volumes:
      - ./dgg_national_ins:/app/in
      - ./../../../data/badger/dgg_national_ins:/app/data
    build:
      args:
        sleep_time: 0
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: on-failure

  dgg_national_home_recent:
    container_name: dgg_national_home_recent
    volumes:
      - ./dgg_national_home_recent:/app/in
      - ./../../../data/badger/dgg_national_home_recent:/app/data
    build:
      args:
        sleep_time: 0
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: on-failure


  dgg_subnational:
    container_name: dgg_subnational
    volumes:
      - ./dgg_subnational:/app/in
      - ./../../../data/badger/dgg_subnational:/app/data
    build:
      args:
        pysocialwatcher_opt_flag: "true"
        betterestimates: "true"
        sleep_time: 0
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: on-failure


