services:

  global_migration_pacific:
    container_name: global_migration_pacific
    volumes:
      - ./global_migration_pacific:/app/in
      - ./../../../data/serenity/global_migration_pacific:/app/data
    build:
      args:
          sleep_time: 2
          email_notification_enable: "True"
          email_receiver: "douglas.leasure@demography.ox.ac.uk"
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: unless-stopped

