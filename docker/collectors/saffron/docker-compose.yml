# docker-compose to deploy multiple collectors
version: '3.3'

services:

  ukraine_regions:
    container_name: ukraine_regions
    volumes:
      - ./ukraine_regions:/app/in
      - ./../../../data/saffron/ukraine_regions:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: on-failure

  ukraine_neighbours:
    container_name: ukraine_neighbours
    volumes:
      - ./ukraine_neighbours:/app/in
      - ./../../../data/saffron/ukraine_neighbours:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: on-failure

  ukraine_language:
    container_name: ukraine_language
    volumes:
      - ./ukraine_language:/app/in
      - ./../../../data/saffron/ukraine_language:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: on-failure

  ukraine_europe:
    container_name: ukraine_europe
    volumes:
      - ./ukraine_europe:/app/in
      - ./../../../data/saffron/ukraine_europe:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: unless-stopped

  ukraine_admin2_tesselation:
    container_name: ukraine_admin2_tesselation
    volumes:
      - ./ukraine_admin2_tesselation:/app/in
      - ./../../../data/saffron/ukraine_admin2_tesselation:/app/data
    build:
      args:
        sleep_time: 0
        email_notification_enable: "True"
        email_receiver: "douglas.leasure@demography.ox.ac.uk,edith.darin@demography.ox.ac.uk"
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: on-failure

