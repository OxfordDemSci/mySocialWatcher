# docker-compose to deploy multiple collectors
version: '3.3'

services:

  ukraine_regions:
    container_name: ukraine_regions
    volumes:
      - ./ukraine_regions:/app/in
      - ./../../../data/saffron/ukraine_regions:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: unless-stopped

  ukraine_neighbours1:
    container_name: ukraine_neighbours1
    volumes:
      - ./ukraine_neighbours1:/app/in
      - ./../../../data/saffron/ukraine_neighbours1:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: unless-stopped

  ukraine_neighbours2:
    container_name: ukraine_neighbours2
    volumes:
