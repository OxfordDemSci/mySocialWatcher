      - ./../../../data/saffron/ukraine_neighbours2:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: unless-stopped

  ukraine_language:
    container_name: ukraine_language
    volumes:
      - ./ukraine_language:/app/in
      - ./../../../data/saffron/ukraine_language:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: unless-stopped

  ukraine_europe:
    container_name: ukraine_europe
    volumes:
      - ./ukraine_europe:/app/in
      - ./../../../data/saffron/ukraine_europe:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: unless-stopped

  ukraine_countries:
    container_name: ukraine_countries
    volumes:
      - ./ukraine_countries:/app/in
      - ./../../../data/saffron/ukraine_countries:/app/data
    build:
      context: ./../../../
      dockerfile: ./docker/collectors/Dockerfile
    restart: unless-stopped
