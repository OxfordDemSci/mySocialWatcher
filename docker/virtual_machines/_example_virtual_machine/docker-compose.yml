# example docker-compose to deploy one or more collections on a virtual machine
version: '3.3'

services:
  example_collection:
    container_name: example_collection
    volumes:
      - ./../../../data/_example_collection:/app/data
    build:
      args:
        collection_dir: "./docker/virtual_machines/_example_virtual_machine/_example_collection"
      context: ./../../../
      dockerfile: ./docker/virtual_machines/Dockerfile
    restart: unless-stopped
