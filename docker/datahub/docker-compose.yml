version: "3.3"

services:

  nginx_psw:
    container_name: web_psw
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/nginx.conf
      - ./public_html/:/var/www/public_html/
    ports:
      - "80:80"
      - "443:443"
    networks:
      - net_psw
    depends_on:
      - flask_psw
    restart: unless-stopped

  flask_psw:
    container_name: api_psw
    env_file: .env
    build:
      dockerfile: ./deploy/docker/datahub/Dockerfile
      context: ./../../../
    command: gunicorn --config gunicorn_config.py wsgi:app
    depends_on:
      - postgres_psw
    networks:
      - net_psw
    ports:
      - "5000:5000"
      - "8000:8000"
    restart: unless-stopped


  memcached_psw:
    container_name: limiter_psw
    image: memcached:latest
    networks:
      - net_psw
    ports:
      - "11211:11211"
    restart: unless-stopped


  postgres_psw:
    container_name: db_psw
    image: postgis/postgis:14-3.3
    env_file: .env
    volumes:
      - ./initdb.sh:/docker-entrypoint-initdb.d/initdb.sh
    networks:
      - net_psw
    ports:
      - "5432:5432"
    restart: unless-stopped


networks:
  net_psw:
