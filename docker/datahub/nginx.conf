map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

upstream flask-app {
    server datahub_api:8000;
}

server {
   listen                80 default_server;
   server_name           127.0.0.1;
   root                  /var/www/public_html;
   index                 index.html;

   location /api/v1/ {
       proxy_pass          http://flask-app/;

       proxy_redirect    off;
       proxy_set_header  Host              $http_host;
       proxy_set_header  X-Real-IP         $remote_addr;
       proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
       proxy_set_header  X-Forwarded-Proto $scheme;
   }
}

server {
    listen 80;
    server_name  digitrace-datahub.ndph.ox.ac.uk  www.digitrace-datahub.ndph.ox.ac.uk;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name digitrace-datahub.ndph.ox.ac.uk  www.digitrace-datahub.ndph.ox.ac.uk;

    ssl_certificate /etc/letsencrypt/live/digitrace-datahub.ndph.ox.ac.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digitrace-datahub.ndph.ox.ac.uk/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
